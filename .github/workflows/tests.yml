# Pruebas del servidor en cada push y pull request. Antes nada corría las
# pruebas antes de que Render desplegara: un push con un error llegaba
# directo a producción. En Render se puede activar "Auto-Deploy: After CI
# Checks Pass" para que solo despliegue si este workflow pasa.
name: Pruebas

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Pruebas del servidor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS. Ojo: server/Dockerfile todavía usa Node 20, que ya no
          # tiene soporte (fin de vida: abril de 2026).
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Revisar la sintaxis del cliente
        working-directory: client
        # race3d.js es un módulo ES: se revisa como .mjs para que Node no lo
        # trate como CommonJS.
        run: |
          for f in js/*.js; do
            if grep -q "^import " "$f"; then cp "$f" "$RUNNER_TEMP/check.mjs" && node --check "$RUNNER_TEMP/check.mjs"
            else node --check "$f"; fi
          done

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -f server/Dockerfile -t karswcol:ci .
      - name: Arrancar el contenedor y esperar /health
        run: |
          docker run -d --name karswcol -p 3000:3000 -e SESSION_SECRET=ci karswcol:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs karswcol
          exit 1
      - name: El cliente se sirve desde el contenedor
        run: curl -fs http://localhost:3000/ | grep -q "screen-login"
