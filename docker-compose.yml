# Vista de infraestructura y despliegue (sección 4.2 de la propuesta).
# Alcance actual del curso: todo corre en una sola máquina/VM con Docker
# Compose. Redis y PostgreSQL ya están orquestados aquí como parte del
# entorno, pero el Game Engine y el Ranking Service todavía no los consumen
# (ver TODO en server/src/ranking-persistence/rankingService.js) — es el
# trabajo planeado para el siguiente sprint del release plan.
#
# Observabilidad (ver README, sección "Observabilidad y pruebas de carga"):
#   Prometheus  http://localhost:9090  métricas del servidor (+ alertas) y de k6
#   Grafana     http://localhost:3001  dashboards "KARSWCOL — Servidor" y "— Pruebas de carga"
#   Loki        logs JSON del servidor, recogidos por Promtail
#   k6          pruebas de carga, perfil "loadtest":
#                 docker compose --profile loadtest run --rm k6 run /scripts/load.js

services:
  gateway:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://karswcol:karswcol@postgres:5432/karswcol
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Vacío = login sintético de k6 deshabilitado. Definirlo solo para pruebas de carga.
      LOAD_TEST_TOKEN: ${LOAD_TEST_TOKEN:-}
    labels:
      logging: promtail
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: karswcol
      POSTGRES_PASSWORD: karswcol
      POSTGRES_DB: karswcol
    ports:
      - "5432:5432"
    volumes:
      - karswcol_pgdata:/var/lib/postgresql/data

  # ---------------------------------------------------------- observabilidad
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver   # k6 empuja sus métricas aquí
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/prometheus/secretos:/etc/prometheus/secretos:ro   # token de /metrics de Render
      - prometheus_data:/prometheus
    depends_on:
      - gateway

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # ver dashboards sin iniciar sesión (solo lectura)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/karswcol-servidor.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # ---------------------------------------------------------- pruebas de carga
  # No arranca con "docker compose up": se lanza a demanda, por ejemplo
  #   docker compose --profile loadtest run --rm k6 run /scripts/smoke.js
  # Reporte HTML: load-tests/results/reporte.html. Panel en vivo: http://localhost:5665
  k6:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    ports:
      - "5665:5665"
    environment:
      BASE_URL: http://gateway:3000
      LOAD_TEST_TOKEN: ${LOAD_TEST_TOKEN:-}
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg,min,max"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_EXPORT: /scripts/results/reporte.html
    volumes:
      - ./load-tests:/scripts
    depends_on:
      - gateway
      - prometheus

  # ---------------------------------------------------------- calidad de código
  # Tampoco arranca con "docker compose up". Ver README, "Calidad de código":
  #   docker compose --profile quality up -d sonarqube      -> http://localhost:9000
  #   docker compose --profile quality run --rm sonar-scanner
  sonarqube:
    image: sonarqube:10.7-community
    profiles: ["quality"]
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:11.1
    profiles: ["quality"]
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - ./:/usr/src
    depends_on:
      - sonarqube

volumes:
  sonarqube_data:
  sonarqube_extensions:
  karswcol_pgdata:
  prometheus_data:
  loki_data:
  grafana_data:
