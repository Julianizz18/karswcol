# Prometheus en modo local (sin Docker): mismo scrape que el de Docker, pero
# apuntando a localhost. Las alertas se reutilizan de ../prometheus/alerts.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - ../prometheus/alerts.yml

scrape_configs:
  - job_name: karswcol
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:3000']
        labels:
          service: gateway
          entorno: local

  # Servidor en Render; ver ../prometheus/prometheus.yml para el token.
  - job_name: karswcol-render
    metrics_path: /metrics
    scheme: https
    scrape_interval: 15s
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: ../prometheus/secretos/render_metrics_token
    static_configs:
      - targets: ['karswcol.onrender.com']
        labels:
          service: gateway
          entorno: render
    relabel_configs:
      - target_label: job
        replacement: karswcol

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
