# Prometheus en modo local (sin Docker): mismo scrape que el de Docker, pero
# apuntando a localhost. Las alertas se reutilizan de ../prometheus/alerts.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - ../prometheus/alerts.yml

scrape_configs:
  - job_name: karswcol
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:3000']
        labels:
          service: gateway

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
