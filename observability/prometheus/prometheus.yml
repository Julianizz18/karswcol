# Prometheus — recolección de métricas de KARSWCOL.
# El servidor expone GET /metrics (prom-client). k6 además empuja sus
# métricas por remote-write (flag --web.enable-remote-write-receiver en
# docker-compose.yml), así carga y servidor se ven en la misma línea de tiempo.

global:
  scrape_interval: 5s      # el game loop corre a 20 Hz: intervalos cortos para ver picos
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: karswcol
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:3000']
        labels:
          service: gateway
          entorno: local

  # Servidor desplegado en Render (https://karswcol.onrender.com). Su /metrics
  # exige "Authorization: Bearer <METRICS_TOKEN>": el token se copia del
  # dashboard de Render (Environment) a secretos/render_metrics_token
  # (archivo ignorado por git). Sin ese archivo este target sale "down".
  # Intervalo más largo que el local: el plan gratuito tarda en despertar.
  - job_name: karswcol-render
    metrics_path: /metrics
    scheme: https
    scrape_interval: 15s
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secretos/render_metrics_token
    static_configs:
      - targets: ['karswcol.onrender.com']
        labels:
          service: gateway
          entorno: render
    # Mismo job que el local para que dashboards y alertas (job="karswcol")
    # sirvan para ambos; se distinguen por la etiqueta "entorno".
    relabel_configs:
      - target_label: job
        replacement: karswcol

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
