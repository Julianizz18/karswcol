# Prometheus — recolección de métricas de KARSWCOL.
# El servidor expone GET /metrics (prom-client). k6 además empuja sus
# métricas por remote-write (flag --web.enable-remote-write-receiver en
# docker-compose.yml), así carga y servidor se ven en la misma línea de tiempo.

global:
  scrape_interval: 5s      # el game loop corre a 20 Hz: intervalos cortos para ver picos
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: karswcol
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:3000']
        labels:
          service: gateway

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
