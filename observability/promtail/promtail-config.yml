# Promtail — recoge los logs de los contenedores de Docker y los envía a Loki.
# Solo se leen los contenedores con la etiqueta logging=promtail (ver
# docker-compose.yml). El servidor escribe logs JSON (src/observability/logger.js),
# así que aquí se extraen "level" y "event" como etiquetas para filtrar en Grafana.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['logging=promtail']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - target_label: app
        replacement: karswcol
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
      - labels:
          level:
