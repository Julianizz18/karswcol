# Análisis estático de KARSWCOL con SonarQube. Ver la sección "Calidad de
# código (SonarQube)" del README para levantar el servidor y lanzar el análisis.
sonar.projectKey=karswcol
sonar.projectName=KARSWCOL
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Código propio: servidor, cliente y pruebas de carga.
sonar.sources=server/src,client/js,load-tests
sonar.tests=server/test
sonar.exclusions=**/node_modules/**,client/vendor/**,load-tests/results/**,server/coverage/**

# Cobertura generada con: cd server && npm run coverage
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
# La cobertura solo se mide en el servidor (el cliente y k6 no tienen pruebas unitarias).
sonar.coverage.exclusions=client/**,load-tests/**
