# Análisis estático de KARSWCOL con SonarCloud (GitHub Actions, ver
# .github/workflows/) o con SonarQube local (README, "Calidad de código").
# En SonarCloud la organización y la clave del proyecto llegan desde el
# workflow (variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY del repositorio).
sonar.projectKey=karswcol
sonar.projectName=KARSWCOL
sonar.projectVersion=0.2.0
sonar.sourceEncoding=UTF-8

# Código propio: servidor, cliente y pruebas de carga.
sonar.sources=server/src,client/js,load-tests
sonar.tests=server/test
sonar.exclusions=**/node_modules/**,client/vendor/**,load-tests/results/**,server/coverage/**

# Cobertura de servidor y cliente generada con: cd server && npm run coverage
# (el cliente se prueba en jsdom: ver server/test/client/harness.js).
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
# Los scripts de k6 no son código de la aplicación: se ejecutan con k6
# contra el sistema desplegado, no con pruebas unitarias.
sonar.coverage.exclusions=load-tests/**
